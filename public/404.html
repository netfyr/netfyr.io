    <meta name="theme-color" content="#211c19" media="(prefers-color-scheme: dark)">
    <script>
      try {
        const mode = localStorage.getItem('netfyr-theme');
        if (mode === 'light' || mode === 'dark') {
          document.documentElement.dataset.uiMode = mode;
          document.querySelectorAll('meta[name="theme-color"]').forEach(meta => {
            meta.content = mode === 'dark' ? '#211c19' : '#faf8f4';
          });
        }
      } catch {}
    </script>
